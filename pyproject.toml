[project]
name = "techspire"
version = "1.0.0"
description = "Techspire Official automated technology-news curation (dry-run first; Facebook publishing locked)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S608"]  # asserts are used for internal invariants; SQL columns come from a fixed allow-list

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "BLE"]
