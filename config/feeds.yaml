# Techspire Official - feed list for the five sectors:
# Technology, Business, Finance, Career Development, Entrepreneurship.
#
# Every enabled feed was checked (read-only) on 2026-09-28 through Techspire's own fetcher,
# with all safety checks on. The AI editor decides the sector of each story; the grouping
# below only shows where each source is strongest.
# Style references (not sources): The Front Page BD, Nutshell Today, Sozoo Today.
#
#   - add a feed:     copy an entry, give it a unique name and its RSS/Atom URL
#   - pause a feed:   set enabled: false
#   - remove a feed:  delete its entry
# Test your changes with:  python -m techspire.main --check-feeds

feeds:
